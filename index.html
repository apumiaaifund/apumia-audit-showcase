<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apumia Audit Showcase — Live Sandbox</title><style>body{font-family:system-ui,sans-serif;background:#0b1220;color:#e5e7eb;max-width:780px;margin:32px auto;padding:0 16px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:18px}textarea{width:100%;height:96px;background:#030712;color:#a7f3d0;border:1px solid #374151;border-radius:8px;padding:10px;font-family:monospace;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:10px}.ok{color:#34d399;font-weight:700;margin-top:12px}.bad{color:#f87171;font-weight:700;margin-top:12px}a{color:#60a5fa;text-decoration:none;font-size:13px}</style></head><body><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b>🛡 Apumia Audit Showcase Live Sandbox</b><a href="https://github.com" target="_blank">← Портфель GitHub ↗</a></div><div class="card"><h1 style="margin:0 0 8px;font-size:22px">Apumia Audit Showcase</h1><p style="color:#9ca3af;font-size:14px">Интерактивная витрина крипто-доказательств для службы безопасности. (Zero-Trust: расчёт локально в браузере).</p>
<div id="eng-bar" style="margin:12px 0;padding:10px;background:#0f172a;border:1px solid #334155;border-radius:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <label style="background:#1e293b;color:#93c5fd;border:1px solid #475569;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer">📂 Загрузить .json / .csv<input type="file" accept=".json,.csv,.txt" style="display:none" onchange="engLoadFile(this)"></label>
  <button type="button" onclick="engPreset(true)" style="background:#064e3b;color:#6ee7b7;border:1px solid #059669;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer">✅ Тест: Валидные данные</button>
  <button type="button" onclick="engPreset(false)" style="background:#7f1d1d;color:#fca5a5;border:1px solid #dc2626;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer">⛔ Тест: Нарушение правила</button>
  <span id="eng-fn" style="font-size:12px;color:#94a3b8"></span>
</div>
<textarea id="inp">{"audit_id":"AUD-2026-88","verified":true}</textarea><button onclick="chk()">Проверить данные</button><div id="res" class="ok">Готов к локальной проверке</div></div><script>function chk(){const r=document.getElementById("res");try{const d=JSON.parse(document.getElementById("inp").value);const bad=Object.values(d).some(v=>v===false||(typeof v==="number"&&v<0));r.className=bad?"bad":"ok";r.textContent=(bad?"⛔ BLOCKED (Fail-Closed): обнаружено нарушение инварианта":"✅ VERIFIED & SIGNED: политика соблюдена (0.4 ms)")}catch(e){r.className="bad";r.textContent="⛔ Ошибка JSON: "+e.message}}
function engTarget(){return document.querySelector('textarea')||document.querySelector('input[type=text]');}
function engRun(){const b=Array.from(document.querySelectorAll('button')).find(x=>/проверить|verify|check|run|сертифик/i.test(x.textContent||''));if(b)b.click();}
function engPreset(ok){const t=engTarget();if(!t)return;t.value=ok?JSON.stringify({status:"valid",verified:true,amount:15000,kex:"ML-KEM-768",human_oversight:true,quorum_nodes:5},null,2):JSON.stringify({status:"violation",verified:false,amount:-500,kex:"RSA-2048",human_oversight:false,quorum_nodes:1},null,2);engRun();}
function engLoadFile(inp){const f=inp.files&&inp.files;if(!f)return;document.getElementById('eng-fn').textContent=f.name;const r=new FileReader();r.onload=e=>{let raw=String(e.target.result||'').trim();if(f.name.toLowerCase().endsWith('.csv')&&!raw.startsWith('{')){const ls=raw.split(/\r?\n/).filter(Boolean);if(ls.length>=2){const ks=ls.split(',').map(x=>x.trim()),vs=ls.split(',').map(x=>x.trim()),o={};ks.forEach((k,i)=>{const n=Number(vs[i]);o[k]=isNaN(n)?(vs[i]==='true'?true:vs[i]==='false'?false:vs[i]):n;});raw=JSON.stringify(o,null,2);}}const t=engTarget();if(t){t.value=raw;engRun();}};r.readAsText(f);}

</script></body></html>
